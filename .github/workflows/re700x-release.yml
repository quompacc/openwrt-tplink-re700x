name: Build & release RE700X factory image

# Builds the OpenWrt RE700X image, wraps it into the stock-web-GUI-flashable
# factory image (re700x-factory-pack.py), and publishes a GitHub Release with
# the assets. Triggers automatically on a re700x-v* tag push; can also be run
# manually for an existing tag. Uses the built-in GITHUB_TOKEN — no manual token.

on:
  push:
    tags:
      - 're700x-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build & release (e.g. re700x-v1.1)'
        required: true
        default: 're700x-v1.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-distutils rsync unzip zlib1g-dev file wget libelf-dev ecj \
            fastjar java-propose-classpath

      - name: Configure (RE700X only)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_tplink_re700x=y
          CONFIG_LUCI_LANG_de=y
          EOF
          make defconfig

      - name: Build OpenWrt
        run: |
          make -j"$(nproc)" download
          make -j"$(nproc)" || make -j1 V=s

      - name: Pack stock-web-GUI factory image + collect assets
        id: assets
        run: |
          set -e
          T='${{ steps.tag.outputs.tag }}'
          OUT=bin/targets/qualcommax/ipq50xx
          UBI=$(ls "$OUT"/*tplink_re700x-squashfs-factory.ubi)
          mkdir -p rel
          python3 re700x-factory-pack.py --os "$UBI" \
            --bump-version "9.9.9 Build 20991231 Rel. 99999" \
            -o "rel/re700x-$T-factory-webflash.bin"
          cp "$OUT"/*tplink_re700x-squashfs-sysupgrade.bin "rel/re700x-$T-sysupgrade.bin"
          cp "$OUT"/*tplink_re700x-initramfs-uImage.itb     "rel/re700x-$T-recovery-initramfs.itb"
          ( cd rel && sha256sum re700x-$T-* > SHA256SUMS )
          ls -l rel

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RE700X ${{ steps.tag.outputs.tag }}
          fail_on_unmatched_files: true
          files: rel/*
          body: |
            Web-UI-flashable OpenWrt factory image for the TP-Link RE700X
            (IPQ5018 + QCN6122). Upload `re700x-*-factory-webflash.bin` in the
            **stock** TP-Link web GUI to install OpenWrt — no UART, no soldering.

            See `README.RE700X.md` (Install from stock via web GUI) and
            `RE700X-CHANGELOG.md`. Verify downloads against `SHA256SUMS`.
